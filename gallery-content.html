<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JRB Gallery</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <link rel="stylesheet" href="gallery.css" />
  </head>

  <body>
    <!-- Add this button to the top right corner -->
    <div class="top-right-button">
      <button onclick="window.location.href='index.html'">x</button>
    </div>

    <swiper-container
      class="mySwiper"
      pagination="true"
      pagination-clickable="true"
      direction="vertical"
      space-between="30"
      mousewheel="true"
    >
      <swiper-slide
        ><img
          src="/assets/img/gallery/eyebrow1.jpg"
          alt="Eyebrow Design Slide 1"
      /></swiper-slide>
      <swiper-slide
        ><img
          src="/assets/img/gallery/eyebrow2.jpg"
          alt="Eyebrow Design Slide 2"
      /></swiper-slide>
      <swiper-slide
        ><img
          src="/assets/img/gallery/eyebrow3.jpg"
          alt="Eyebrow Design Slide 3"
      /></swiper-slide>
      <swiper-slide
        ><img
          src="/assets/img/gallery/eyebrow4.jpg"
          alt="Eyebrow Design Slide 4"
      /></swiper-slide>
    </swiper-container>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
  </body>
</html>
